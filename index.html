<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cài đặt ứng dụng</title>
<style>
  :root { --bg:#0d1117; --card:#161b22; --fg:#e6edf3; --muted:#8b949e; --accent:#238636; --accent2:#2ea043; --border:#30363d; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--fg);
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:16px;
          padding:28px 24px; max-width:420px; width:100%; text-align:center; }
  .icon { width:88px; height:88px; border-radius:20px; margin:0 auto 16px;
          background:linear-gradient(135deg,#2ea043,#1f6feb); display:flex;
          align-items:center; justify-content:center; font-size:40px; }
  h1 { font-size:22px; margin:8px 0 2px; }
  .ver { color:var(--muted); font-size:14px; margin-bottom:22px; }
  .btn { display:block; width:100%; padding:15px; border-radius:12px; border:none;
         background:var(--accent); color:#fff; font-size:17px; font-weight:600;
         text-decoration:none; margin-bottom:14px; }
  .btn:active { background:var(--accent2); }
  .note { color:var(--muted); font-size:13px; line-height:1.6; text-align:left;
          background:#0d1117; border:1px solid var(--border); border-radius:10px; padding:14px; }
  .note b { color:var(--fg); }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">🛠️</div>
    <h1>SpeedMaint</h1>
    <div class="ver">Phiên bản 1.0.13</div>
    <a class="btn" href="itms-services://?action=download-manifest&url=https://diendv.github.io/ins_ct_spm/speedmaint/SpeedMaint.plist">
      📲 Cài đặt SpeedMaint
    </a>
    <div class="note">
      <b>Hướng dẫn:</b><br>
      1. Mở trang này bằng <b>Safari</b> trên iPhone/iPad.<br>
      2. Bấm nút <b>Cài đặt SpeedMaint</b>, chọn <b>Cài đặt / Install</b>.<br>
      3. Vào <b>Cài đặt → Cài đặt chung → VPN &amp; Quản lý thiết bị</b> để tin cậy chứng chỉ nhà phát triển (lần đầu).
    </div>
  </div>
</body>
</html>
